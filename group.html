<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>SMARTEST GUIDE — Skupinový portál</title>
<style>
  :root{--bg:#f6f8fc;--card:#ffffff;--border:#e3e9f4;--text:#16233b;--muted:#66748f;
        --accent:#2c5fae;--accent2:#f08a2c;--ok:#1fa970;--warn:#e0a11f;--danger:#d9534f;
        --font-head:'Segoe UI',system-ui,sans-serif;--font-body:'Segoe UI',system-ui,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:19px}
  .brand img{width:30px;height:30px}
  h1{font-family:var(--font-head);font-size:24px;font-weight:800;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13.5px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0 26px}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .tile .n{font-family:var(--font-head);font-size:26px;font-weight:800;line-height:1.1}
  .tile .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border)}
  td{padding:10px;font-size:13.5px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f2f6fd}
  .num{text-align:right}.ctr{text-align:center}
  .open{display:inline-block;font-size:12.5px;color:var(--accent);font-weight:700;text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;white-space:nowrap}
  .open:hover{border-color:var(--accent)}
  .warnbox{background:#fdf6e8;border:1px solid #eeddb4;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
  .err{background:#fdeeee;border:1px solid #f0c5c4;border-radius:10px;padding:14px;font-size:14px}
  .dot{font-size:13px}
  footer{margin-top:34px;text-align:center;font-size:12px;color:var(--muted)}
  footer a{color:var(--muted)}
  @media(max-width:640px){.hidem{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="/api/app-icon/64" alt=""/>SMARTEST GUIDE</div>
    <div class="sub" id="hdr-note"></div>
  </header>
  <h1 id="title">🏨 Vaše hotely</h1>
  <div class="sub" id="subtitle">Skupinový přehled — jeden odkaz pro všechny vaše hotely. Uložte si tuto stránku do záložek.</div>
  <div class="tiles" id="tiles" style="display:none"></div>
  <div id="warns"></div>
  <div class="card" id="content"><div class="sub">Načítám…</div></div>
  <footer>Operated by Native Hotel Guide s.r.o. · <a href="mailto:support@smartestguide.com">support@smartestguide.com</a></footer>
</div>
<script>
const API='';
const token=new URLSearchParams(location.search).get('token')||'';
const LANG=(new URLSearchParams(location.search).get('lang')||navigator.language||'cs').toLowerCase().startsWith('cs')?'cs':'en';
const T={
 'Vaše hotely':'Your hotels',
 'Skupinový přehled — jeden odkaz pro všechny vaše hotely. Uložte si tuto stránku do záložek.':'Group overview — one link for all your hotels. Bookmark this page.',
 'Hotelů':'Hotels','Lůžek celkem':'Total beds','Dotazů celkem':'Total questions','Průměrná vyplněnost':'Avg. profile completeness',
 'Hotel':'Hotel','Lůžka':'Beds','Profil':'Profile','Dotazy':'Questions','Stav':'Status',
 'Otevřít portál':'Open portal','Aktivní':'Active','Neaktivní':'Inactive',
 'Chybí přístupový token. Použijte odkaz z portálu některého z vašich hotelů.':'Missing access token. Use the link from one of your hotel portals.',
 'Skupina nenalezena — tento účet má jen jeden hotel, použijte jeho běžný portál.':'No group found — this account has a single hotel, use its regular portal.',
 'Nepodařilo se načíst data. Zkuste stránku obnovit.':'Failed to load data. Try refreshing the page.',
 'spojení s Apaleo selhává — Alex odpovídá jen z profilu':'Apaleo connection failing — Alex answers from the profile only',
 'profil vyplněný pod 60 % — Alex nemá z čeho odpovídat':'profile below 60 % — Alex is short on answers',
 'Vše v pořádku — žádný hotel nehlásí problém.':'All good — no hotel reports a problem.'
};
const tr=t=>LANG==='en'?(T[t]||t):t;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function init(){
  document.getElementById('title').textContent='🏨 '+tr('Vaše hotely');
  document.getElementById('subtitle').textContent=tr('Skupinový přehled — jeden odkaz pro všechny vaše hotely. Uložte si tuto stránku do záložek.');
  const box=document.getElementById('content');
  if(!token){box.innerHTML=`<div class="err">${tr('Chybí přístupový token. Použijte odkaz z portálu některého z vašich hotelů.')}</div>`;return;}
  let d;
  try{
    const r=await fetch(`${API}/api/hotel-portal/group?token=${encodeURIComponent(token)}`);
    if(!r.ok)throw new Error('http '+r.status);
    d=await r.json();
  }catch(e){box.innerHTML=`<div class="err">${tr('Nepodařilo se načíst data. Zkuste stránku obnovit.')}</div>`;return;}
  const hs=d.hotels||[];
  if(hs.length<2){box.innerHTML=`<div class="err">${tr('Skupina nenalezena — tento účet má jen jeden hotel, použijte jeho běžný portál.')}</div>`;return;}
  hs.sort((a,b)=>a.name.localeCompare(b.name));
  // Souhrnné dlaždice
  const beds=hs.reduce((x,h)=>x+(h.beds||0),0);
  const q=hs.reduce((x,h)=>x+(h.questions_total||0),0);
  const comp=Math.round(hs.reduce((x,h)=>x+(h.completeness||0),0)/hs.length);
  const tiles=document.getElementById('tiles');
  tiles.style.display='grid';
  tiles.innerHTML=[[hs.length,tr('Hotelů')],[beds,tr('Lůžek celkem')],[q,tr('Dotazů celkem')],[comp+' %',tr('Průměrná vyplněnost')]]
    .map(([n,l])=>`<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  // Varování — hotely, které si žádají pozornost
  const warns=[];
  for(const h of hs){
    if(h.pms_fail)warns.push(`<b>${esc(h.name)}</b> — ${tr('spojení s Apaleo selhává — Alex odpovídá jen z profilu')}`);
    if((h.completeness||0)<60)warns.push(`<b>${esc(h.name)}</b> — ${tr('profil vyplněný pod 60 % — Alex nemá z čeho odpovídat')}`);
  }
  document.getElementById('warns').innerHTML=warns.length
    ?`<div class="warnbox">⚠️ ${warns.join('<br>⚠️ ')}</div>`
    :`<div class="warnbox" style="background:#eef8f2;border-color:#c9e7d6">✅ ${tr('Vše v pořádku — žádný hotel nehlásí problém.')}</div>`;
  // Tabulka hotelů
  box.innerHTML=`<div style="overflow-x:auto"><table>
    <thead><tr><th>${tr('Hotel')}</th><th class="hidem">Property</th><th class="num">${tr('Lůžka')}</th>
      <th class="num">${tr('Profil')}</th><th class="num hidem">${tr('Dotazy')}</th><th class="ctr">${tr('Stav')}</th><th></th></tr></thead>
    <tbody>${hs.map(h=>`
      <tr>
        <td style="font-weight:700">${esc(h.name)}${h.pms_fail?' <span title="Apaleo">⚠️</span>':''}</td>
        <td class="hidem" style="color:var(--muted);font-size:12.5px">${esc(h.property||'—')}</td>
        <td class="num">${h.beds||'—'}</td>
        <td class="num" style="color:${h.completeness>=80?'var(--ok)':h.completeness>=60?'var(--warn)':'var(--danger)'};font-weight:700">${h.completeness} %</td>
        <td class="num hidem">${h.questions_total}</td>
        <td class="ctr"><span class="dot" style="color:${h.active?'var(--ok)':'var(--danger)'}" title="${h.active?tr('Aktivní'):tr('Neaktivní')}">●</span></td>
        <td class="num"><a class="open" href="/portal?token=${encodeURIComponent(h.token)}">${tr('Otevřít portál')} →</a></td>
      </tr>`).join('')}</tbody>
  </table></div>`;
}
init();
</script>
</body>
</html>
