<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="no-referrer"/>
<title>SMARTEST GUIDE – Přehled</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--border:#e8e4dc;--accent:#FF6B00;--teal:#0aa88a;
  --teal-soft:#bfe9df;--bad:#e5484d;--soft:#f1efe9;--head:'Syne',sans-serif;--body:'Inter',sans-serif}
html{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
.top{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--head);font-weight:700;font-size:15px;white-space:nowrap}.logo span{color:var(--accent)}
.hname{color:var(--muted);font-size:13px;margin-right:auto}.hname strong{color:var(--ink)}
.btn{font:600 12.5px var(--body);border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 12.5px var(--body);border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--head);font-size:22px;line-height:1.2}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;grid-column:span 12;min-width:0}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}
@media(max-width:860px){.c6,.c4,.c8{grid-column:span 12}}
.card h2{font-family:var(--head);font-size:15px;margin-bottom:2px}
.card .desc{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#1a1a1a,#2c2a27);color:#fff;border:0}
.hero .desc{color:rgba(255,255,255,.7)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi .v{font-family:var(--head);font-size:30px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
.hero .kpi .v{color:#ff8a3d;font-size:38px}.hero .kpi .l{color:rgba(255,255,255,.75)}
.trend{font-size:12px;font-weight:700;margin-top:4px}.up{color:#2ecc87}.down{color:#ff8a8f}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.hero .note{color:rgba(255,255,255,.65)}.hero .note a{color:#ff8a3d;cursor:pointer;text-decoration:underline}
.cols{display:flex;align-items:flex-end;gap:4px;height:170px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0;position:relative}
.col .n{font-size:10.5px;text-align:center;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.col .b{border-radius:4px 4px 0 0;background:var(--teal);min-height:0}
.col .b.bad{background:var(--bad);border-radius:4px 4px 0 0}.col .b.bad + .b{border-radius:0}
.col .b.off{background:var(--accent)}.col .b.in{background:var(--teal-soft)}
.xl{display:flex;gap:4px;margin-top:6px}.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{margin-bottom:10px}.hb .t{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.hb .t b{font-weight:600}.hb .t > span{color:var(--muted);white-space:nowrap}
.hb .tr{height:8px;background:var(--soft);border-radius:5px;overflow:hidden}.hb .tr div{height:100%;background:var(--teal);border-radius:5px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:1px 8px;background:rgba(229,72,77,.1);color:var(--bad);margin-left:6px}
.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}td.d{white-space:nowrap;color:var(--muted)}
tr:last-child td{border-bottom:0}
.set{display:none;margin-top:14px;background:rgba(255,255,255,.07);border-radius:10px;padding:14px}
.set.show{display:block}
.set .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.set label{font-size:11.5px;color:rgba(255,255,255,.75);display:block;margin-bottom:3px}
.set input{width:100%;font:500 14px var(--body);padding:7px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff}
.set .acts{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set .btn{background:var(--accent);border-color:var(--accent);color:#fff}.set .btn.ghost{background:transparent;border-color:rgba(255,255,255,.3)}
#msg{font-size:12px;color:rgba(255,255,255,.8)}
#err{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
@media(max-width:560px){.hero .kpi .v{font-size:28px}.kpi .v{font-size:24px}.wrap{padding:14px}td.tp,th.tp{display:none}.hname{width:100%;order:9}}
@media print{
  .top,.seg,.noprint,.set{display:none!important}
  body{background:#fff}.wrap{padding:0;max-width:none}
  .card{break-inside:avoid;border-color:#ccc}
  .hero{background:#fff!important;color:#000;border:1px solid #ccc}
  .hero .kpi .v{color:#c45200}.hero .kpi .l,.hero .desc,.hero .note{color:#444}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.embed .top{position:static;background:transparent;border:0}.embed .logo,.embed #hname,.embed #b-back{display:none}.embed .top-in{justify-content:flex-end}.embed body{background:transparent}.embed .wrap{padding-left:0;padding-right:0}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="logo">SMARTEST <span>GUIDE</span></div>
  <div class="hname" id="hname"></div>
  <a class="btn" id="b-csv"></a>
  <button class="btn" id="b-print" onclick="window.print()"></button>
  <a class="btn" id="b-back"></a>
</div></div>
<div class="wrap" id="app"></div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const TQ = encodeURIComponent(token);
const EMBED = new URLSearchParams(location.search).get('embed') === '1';   // vloženo v portálu (záložka Analytika)
if(EMBED) document.documentElement.classList.add('embed');
let OV = null, PER = 'this', LANG = '';
try{ PER = localStorage.getItem('sg_ov_period') || 'this'; }catch(e){}

const T = {
cs:{title:'Přehled & statistiky',sub:'Jak Alex slouží vašim hostům',back:'← Zpět do portálu',print:'🖨 Tisk / PDF',csv:'⬇ Export CSV',
  p_this:'Tento měsíc',p_prev:'Minulý měsíc',p_3m:'3 měsíce',p_12m:'12 měsíců',
  save_t:'Úspora pro recepci',save_d:'Každý dotaz, který Alex vyřídil, nemusela řešit recepce.',
  k_hours:'ušetřených hodin',k_money:'úspora nákladů',k_q:n=>pl(n,'dotaz hosta','dotazy hostů','dotazů hostů'),vs:'oproti předchozímu období',
  assume:(m,w,c)=>`Počítáme ${m} min práce recepce na jeden dotaz a ${w} ${c} za hodinu.`,def:' Jde o výchozí odhad — ',edit:'upravit podle vašeho hotelu',
  alltime:(q,h,m,n)=>`Od začátku: ${q} ${pl(n,'dotaz','dotazy','dotazů')}, ${h} h, ${m}.`,
  s_min:'Minut na jeden dotaz',s_wage:'Náklad na hodinu recepce',s_cur:'Měna',s_from:'Recepce otevřena od (hod.)',s_to:'Recepce otevřena do (hod.)',
  s_save:'Uložit',s_cancel:'Zavřít',s_ok:'Uloženo.',s_err:'Uložení se nepovedlo.',s_hint:'Nonstop recepce: 0 až 24.',
  dev_t:'Vývoj za 12 měsíců',dev_d:'Počet dotazů po měsících.',l_ans:'zodpovězeno',l_un:'bez odpovědi',
  eng_t:'Zapojení hostů',eng_d:'Kolik hostů si průvodce otevřelo a kolik se zeptalo.',
  e_vis:n=>pl(n,'host otevřel průvodce','hosté otevřeli průvodce','hostů otevřelo průvodce'),e_ask:n=>pl(n,'host se zeptal','hosté se zeptali','hostů se zeptalo'),e_conv:'z návštěvníků položilo dotaz',e_ret:n=>pl(n,'host se vrátil další den','hosté se vrátili další den','hostů se vrátilo další den'),e_qpa:'dotazů na jednoho hosta',e_opens:'otevření celkem',
  when_t:'Kdy se hosté ptají',when_d:'Hodiny jsou v místním čase hotelu.',
  off:(p,n,f,t)=>`${p} % dotazů (${n}) přišlo mimo provoz recepce (${f}:00–${t}:00).`,off24:'Recepce je nastavená jako nonstop.',
  l_in:'v provozu recepce',l_off:'mimo provoz recepce',wd:['Po','Út','St','Čt','Pá','So','Ne'],wd_t:'Dny v týdnu',
  since:(a,b)=>`Tento údaj sbíráme nově — zachycuje ${a} z ${b} dotazů v období.`,nodata_new:'Tento údaj sbíráme nově. Zobrazí se po prvních dotazech hostů.',
  lang_t:'Jazyky hostů',lang_d:'V jakém jazyce hosté s Alexem mluví.',
  top_t:'Na co se ptají',top_d:'Témata dotazů.',un_tag:n=>`${n}× bez odpovědi`,
  gap_t:'Mezery ve znalostech',gap_d:d=>`Dotazy, na které Alex neměl dost informací (posledních ${d} dní). Doplněním do profilu hotelu je příště zodpoví.`,
  rate:'dotazů Alex zodpověděl',gap_n:n=>pl(n,'dotaz bez odpovědi','dotazy bez odpovědi','dotazů bez odpovědi'),gap_none:'Žádné dotazy bez odpovědi. 👍',gap_csv:'⬇ Seznam do CSV',gap_fill:'Doplnit v portálu →',
  g_date:'Datum',g_topic:'Téma',g_q:'Dotaz hosta',more:n=>`Zobrazit dalších ${n}`,
  ord_t:'Objednávky a požadavky',ord_d:'Co si hosté přes Alexe objednali.',o_req:'požadavků na recepci',o_conf:'potvrzeno',o_decl:'nelze vyřídit',o_book:'zapsáno přímo do PMS',
  o_30:'Posledních 30 dní',o_med:m=>`Recepce odpovídá obvykle do ${m}.`,o_wait:n=>`Čeká na odpověď: ${n}`,o_top:'Nejžádanější',
  voice_t:'Hlas',voice_d:'Jak hosté využívají mluvení a poslech.',v_stt:'min hosté nadiktovali',v_tts:'znaků Alex přečetl nahlas',
  none:'V tomto období zatím nic.',min:'min',h:'h',err:'Přehled se nepodařilo načíst. Otevřete ho prosím odkazem z portálu hotelu.'},
en:{title:'Overview & statistics',sub:'How Alex serves your guests',back:'← Back to portal',print:'🖨 Print / PDF',csv:'⬇ Export CSV',
  p_this:'This month',p_prev:'Last month',p_3m:'3 months',p_12m:'12 months',
  save_t:'Savings for reception',save_d:'Every question Alex handled is one the front desk did not have to.',
  k_hours:'hours saved',k_money:'cost savings',k_q:n=>n===1?'guest question':'guest questions',vs:'vs. previous period',
  assume:(m,w,c)=>`Based on ${m} min of reception work per question and ${w} ${c} per hour.`,def:' This is a default estimate — ',edit:'adjust for your hotel',
  alltime:(q,h,m,n)=>`All time: ${q} ${n===1?'question':'questions'}, ${h} h, ${m}.`,
  s_min:'Minutes per question',s_wage:'Reception cost per hour',s_cur:'Currency',s_from:'Reception open from (hour)',s_to:'Reception open until (hour)',
  s_save:'Save',s_cancel:'Close',s_ok:'Saved.',s_err:'Saving failed.',s_hint:'24/7 reception: 0 to 24.',
  dev_t:'Last 12 months',dev_d:'Questions per month.',l_ans:'answered',l_un:'unanswered',
  eng_t:'Guest engagement',eng_d:'How many guests opened the guide and how many asked.',
  e_vis:n=>n===1?'guest opened the guide':'guests opened the guide',e_ask:n=>n===1?'guest asked a question':'guests asked a question',e_conv:'of visitors asked a question',e_ret:n=>n===1?'guest came back another day':'guests came back another day',e_qpa:'questions per guest',e_opens:'opens in total',
  when_t:'When guests ask',when_d:'Hours are in hotel local time.',
  off:(p,n,f,t)=>`${p}% of questions (${n}) came outside reception hours (${f}:00–${t}:00).`,off24:'Reception is set as 24/7.',
  l_in:'reception open',l_off:'reception closed',wd:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],wd_t:'Days of the week',
  since:(a,b)=>`This is newly collected — it covers ${a} of ${b} questions in the period.`,nodata_new:'This is newly collected. It appears after the first guest questions.',
  lang_t:'Guest languages',lang_d:'Languages guests use with Alex.',
  top_t:'What they ask about',top_d:'Question topics.',un_tag:n=>`${n}× unanswered`,
  gap_t:'Knowledge gaps',gap_d:d=>`Questions Alex lacked information for (last ${d} days). Add the answers to your hotel profile and he will handle them next time.`,
  rate:'of questions answered',gap_n:n=>n===1?'unanswered question':'unanswered questions',gap_none:'No unanswered questions. 👍',gap_csv:'⬇ List as CSV',gap_fill:'Fill in the portal →',
  g_date:'Date',g_topic:'Topic',g_q:'Guest question',more:n=>`Show ${n} more`,
  ord_t:'Orders and requests',ord_d:'What guests ordered through Alex.',o_req:'requests to reception',o_conf:'confirmed',o_decl:'could not arrange',o_book:'booked directly in PMS',
  o_30:'Last 30 days',o_med:m=>`Reception usually replies within ${m}.`,o_wait:n=>`Waiting for a reply: ${n}`,o_top:'Most requested',
  voice_t:'Voice',voice_d:'How guests use speaking and listening.',v_stt:'min dictated by guests',v_tts:'characters read aloud by Alex',
  none:'Nothing in this period yet.',min:'min',h:'h',err:'The overview could not be loaded. Please open it from the link in your hotel portal.'}
};
const L = k => T[LANG][k];
const pl = (n,one,few,many) => { n = Math.abs(Number(n)||0); return n===1 ? one : (n>=2 && n<=4 ? few : many); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc = () => LANG==='cs' ? 'cs-CZ' : 'en-GB';
const nf = (n,d) => Number(n||0).toLocaleString(loc(), {maximumFractionDigits:d||0, minimumFractionDigits:d||0});
const money = n => `${nf(n)} ${OV.settings.currency}`;
const mLabel = (k,long) => new Date(k+'-01T12:00:00').toLocaleDateString(loc(), long?{month:'long',year:'numeric'}:{month:'short'});
function dur(min){ if(min<60) return `${nf(min)} ${L('min')}`; return `${nf(min/60, min<600?1:0)} ${L('h')}`; }

function cols(vals, opt){
  // vals: [{v, v2?, label, title, cls?}] — sloupcový graf; v2 = horní (červená) část
  const max = Math.max(1, ...vals.map(x => x.v + (x.v2||0)));
  const bars = vals.map(x => {
    const tot = x.v + (x.v2||0);
    return `<div class="col" title="${esc(x.title||'')}">${opt&&opt.nums===false?'':`<div class="n">${tot?nf(tot):''}</div>`}`+
      (x.v2?`<div class="b bad" style="height:${x.v2/max*82}%"></div>`:'')+
      `<div class="b ${x.cls||''}" style="height:${x.v/max*82}%"></div></div>`;
  }).join('');
  return `<div class="cols" style="height:${(opt&&opt.h)||170}px">${bars}</div><div class="xl">${vals.map(x=>`<span>${esc(x.label)}</span>`).join('')}</div>`;
}
function hbars(rows){
  const max = Math.max(1, ...rows.map(r => r.count));
  return rows.map(r => `<div class="hb"><div class="t"><b>${esc(r.name)}${r.tag?`<span class="tag">${esc(r.tag)}</span>`:''}</b><span>${nf(r.count)} · ${r.pct} %</span></div><div class="tr"><div style="width:${r.count/max*100}%"></div></div></div>`).join('');
}
const kpi = (v,l,extra) => `<div class="kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div>${extra||''}</div>`;
const card = (cls,t,d,body) => `<div class="card ${cls}"><h2>${esc(t)}</h2><div class="desc">${esc(d)}</div>${body}</div>`;

function periodLabel(p){
  const k = p.keys; return k.length===1 ? mLabel(k[0],true) : `${mLabel(k[0],true)} – ${mLabel(k[k.length-1],true)}`;
}

let gapShown = 15;
function render(){
  const o = OV, p = o.periods[PER] || o.periods['this'], st = o.settings;
  document.documentElement.lang = LANG;
  document.title = 'SMARTEST GUIDE – ' + L('title');
  document.getElementById('hname').innerHTML = `<strong>${esc(o.hotel_name)}</strong>`;
  const bb = document.getElementById('b-back'); bb.textContent = L('back'); bb.href = `/portal?token=${TQ}`;
  const bc = document.getElementById('b-csv'); bc.textContent = L('csv'); bc.href = `/api/hotel-portal/overview-export?token=${TQ}&kind=months&lang=${LANG}`;
  document.getElementById('b-print').textContent = L('print');

  const seg = ['this','prev','3m','12m'].map(k => `<button class="${k===PER?'on':''}" onclick="setPer('${k}')">${L('p_'+k)}</button>`).join('');
  const trend = (PER==='this'||p.trend_pct===null||p.trend_pct===undefined) ? '' :
    `<div class="trend ${p.trend_pct>=0?'up':'down'}">${p.trend_pct>=0?'▲ +':'▼ '}${p.trend_pct} % ${L('vs')}</div>`;
  const isDef = st.is_default.minutes || st.is_default.wage;
  const at = o.all_time;

  // 1) Úspora
  let html = `<div class="bar-row"><div><h1>${L('title')}</h1><div class="sub">${L('sub')} · ${esc(periodLabel(p))}</div></div><div class="seg">${seg}</div></div><div class="grid">`;
  html += `<div class="card hero"><h2>${L('save_t')}</h2><div class="desc">${L('save_d')}</div><div class="kpis">
    ${kpi(nf(p.saved_hours,1), L('k_hours'))}${kpi(money(p.saved_money), L('k_money'))}${kpi(nf(p.count), L('k_q')(p.count), trend)}</div>
    <div class="note">${esc(L('assume')(nf(st.minutes_per_question,st.minutes_per_question%1?1:0), nf(st.hourly_wage), st.currency))}${isDef?L('def'):' '}<a class="noprint" onclick="toggleSet()">${L('edit')}</a>
    ${at.questions?'<br>'+esc(L('alltime')(nf(at.questions), nf(at.saved_hours,1), money(at.saved_money), at.questions)):''}</div>
    <div class="set" id="set"><div class="f">
      <div><label>${L('s_min')}</label><input id="s-min" inputmode="decimal" value="${esc(st.minutes_per_question)}"></div>
      <div><label>${L('s_wage')}</label><input id="s-wage" inputmode="decimal" value="${esc(st.hourly_wage)}"></div>
      <div><label>${L('s_cur')}</label><input id="s-cur" maxlength="4" value="${esc(st.currency)}"></div>
      <div><label>${L('s_from')}</label><input id="s-from" inputmode="numeric" value="${st.reception_from}"></div>
      <div><label>${L('s_to')}</label><input id="s-to" inputmode="numeric" value="${st.reception_to}"></div>
    </div><div class="acts"><button class="btn" onclick="saveSet()">${L('s_save')}</button><button class="btn ghost" onclick="toggleSet()">${L('s_cancel')}</button><span id="msg">${L('s_hint')}</span></div></div></div>`;

  // 2) Vývoj 12 měsíců
  const anyM = o.months.some(m => m.count);
  html += card('c8', L('dev_t'), L('dev_d'), anyM ? cols(o.months.map(m => ({v:m.answered, v2:m.flagged, label:mLabel(m.key),
      title:`${mLabel(m.key,true)}: ${m.count} (${L('l_un')}: ${m.flagged})`}))) +
      `<div class="legend"><span><i style="background:var(--teal)"></i>${L('l_ans')}</span><span><i style="background:var(--bad)"></i>${L('l_un')}</span></div>`
      : `<div class="empty">${L('none')}</div>`);

  // 3) Zapojení
  const eng = [];
  if(p.visitors) eng.push(kpi(nf(p.visitors), L('e_vis')(p.visitors)));
  if(p.askers) eng.push(kpi(nf(p.askers), L('e_ask')(p.askers)));
  if(p.conversion_pct!==null && p.askers) eng.push(kpi(p.conversion_pct+' %', L('e_conv')));
  if(p.returning) eng.push(kpi(nf(p.returning), L('e_ret')(p.returning)));
  if(p.questions_per_asker) eng.push(kpi(nf(p.questions_per_asker,1), L('e_qpa')));
  if(p.visits) eng.push(kpi(nf(p.visits), L('e_opens')));
  html += card('c4', L('eng_t'), L('eng_d'), eng.length ? `<div class="kpis" style="grid-template-columns:1fr 1fr">${eng.join('')}</div>` : `<div class="empty">${L('none')}</div>`);

  // 4) Kdy se ptají
  let when;
  if(p.time_tracked){
    const f = st.reception_from, t = st.reception_to;
    when = cols(p.hours.map((v,i) => ({v, label:(i%3===0? i : ''), cls:(i>=f&&i<t)?'in':'off', title:`${i}:00–${i+1}:00: ${v}`})), {nums:false, h:130}) +
      `<div class="legend"><span><i style="background:var(--teal-soft)"></i>${L('l_in')}</span><span><i style="background:var(--accent)"></i>${L('l_off')}</span></div>` +
      `<div class="note" style="color:var(--ink);font-weight:600">${(f===0&&t===24)?L('off24'):esc(L('off')(p.off_hours_pct, nf(p.off_hours_count), f, t))}</div>` +
      `<div class="desc" style="margin:16px 0 6px">${L('wd_t')}</div>` + cols(p.wdays.map((v,i)=>({v, label:L('wd')[i], title:`${L('wd')[i]}: ${v}`})), {h:90}) +
      (p.time_tracked < p.count ? `<div class="note">${esc(L('since')(nf(p.time_tracked), nf(p.count)))}</div>` : '');
  } else when = `<div class="empty">${L('nodata_new')}</div>`;
  html += card('c6', L('when_t'), L('when_d'), when);

  // 5) Jazyky + 6) Témata
  html += card('c6', L('lang_t'), L('lang_d'), p.langs.length ? hbars(p.langs.slice(0,8)) : `<div class="empty">${L('none')}</div>`);
  html += card('c6', L('top_t'), L('top_d'), p.topics.length ?
    hbars(p.topics.map(x => ({name:x.label, count:x.count, pct:x.pct, tag:x.flagged?L('un_tag')(x.flagged):''}))) +
      (p.topics_tracked < p.count ? `<div class="note">${esc(L('since')(nf(p.topics_tracked), nf(p.count)))}</div>` : '')
    : `<div class="empty">${L('nodata_new')}</div>`);

  // 7) Mezery ve znalostech
  const g = o.gaps;
  let gap = `<div class="kpis" style="margin-bottom:14px">${p.answer_rate_pct!==null?kpi(p.answer_rate_pct+' %', L('rate')+' · '+periodLabel(p)):''}${kpi(nf(g.count), L('gap_n')(g.count))}</div>`;
  if(g.items.length){
    const rows = g.items.slice(0,gapShown).map(u => `<tr><td class="d">${esc(u.at?new Date(u.at+'Z').toLocaleDateString(loc()):'')}</td><td class="d tp">${esc(u.topic||'')}</td><td>${esc(u.q)}</td></tr>`).join('');
    gap += `<table><thead><tr><th>${L('g_date')}</th><th class="tp">${L('g_topic')}</th><th>${L('g_q')}</th></tr></thead><tbody>${rows}</tbody></table>`;
    gap += `<div class="legend noprint">`+(g.items.length>gapShown?`<a class="btn" onclick="gapShown+=30;render()">${esc(L('more')(Math.min(30,g.items.length-gapShown)))}</a>`:'')+
      `<a class="btn" href="/api/hotel-portal/overview-export?token=${TQ}&kind=gaps&lang=${LANG}">${L('gap_csv')}</a><a class="btn" href="/portal?token=${TQ}" target="_top">${L('gap_fill')}</a></div>`;
  } else gap += `<div class="empty">${L('gap_none')}</div>`;
  html += card('', L('gap_t'), L('gap_d')(g.keep_days), gap);

  // 8) Objednávky
  if(o.orders_enabled){
    const po = p.orders, od = o.orders;
    let ob = `<div class="kpis" style="grid-template-columns:1fr 1fr;margin-bottom:14px">${kpi(nf(po.requested), L('o_req'))}${kpi(nf(po.confirmed), L('o_conf'))}${kpi(nf(po.declined), L('o_decl'))}${po.booked?kpi(nf(po.booked), L('o_book')):''}</div>`;
    if(od.total){
      ob += `<div class="desc" style="margin-bottom:6px">${L('o_30')}</div>`;
      if(od.median_response_min!==null) ob += `<div style="font-weight:600;margin-bottom:6px">${esc(L('o_med')(dur(od.median_response_min)))}</div>`;
      if(od.pending) ob += `<div style="margin-bottom:8px">${esc(L('o_wait')(od.pending))}</div>`;
      if(od.top.length) ob += `<div class="desc" style="margin:10px 0 6px">${L('o_top')}</div>` + hbars(od.top.map(x => ({name:x.title, count:x.count, pct:Math.round(x.count/od.total*100)})));
    }
    html += card('c6', L('ord_t'), L('ord_d'), ob);
  }

  // 9) Hlas
  if(p.stt_min || p.tts_chars)
    html += card(o.orders_enabled?'c6':'', L('voice_t'), L('voice_d'), `<div class="kpis">${p.stt_min?kpi(nf(p.stt_min,1), L('v_stt')):''}${p.tts_chars?kpi(nf(p.tts_chars), L('v_tts')):''}</div>`);

  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function setPer(k){ PER = k; try{ localStorage.setItem('sg_ov_period', k); }catch(e){} render(); }
function toggleSet(){ const s = document.getElementById('set'); if(s) s.classList.toggle('show'); }
async function saveSet(){
  const v = id => { const e = document.getElementById(id), x = e.value.trim(); return x === e.defaultValue.trim() ? undefined : x; };
  const msg = document.getElementById('msg');
  try{
    const body = JSON.stringify({stats_minutes_per_question:v('s-min'), stats_hourly_wage:v('s-wage'), stats_currency:v('s-cur'),
                                 stats_reception_from:v('s-from'), stats_reception_to:v('s-to')});
    if(body === '{}'){ toggleSet(); return; }
    const r = await fetch(`/api/hotel-portal/update?token=${TQ}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
    if(!r.ok) throw new Error(r.status);
    await load();
  }catch(e){ if(msg) msg.textContent = L('s_err'); }
}
async function load(){
  try{
    let pl = ''; try{ pl = localStorage.getItem('sg_portal_lang') || ''; }catch(e){}
    if(pl!=='en' && pl!=='cs') pl = '';
    const r = await fetch(`/api/hotel-portal/overview?token=${TQ}&lang=${pl}`, {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    OV = (await r.json()).overview;
    LANG = OV.lang;
    if(!OV.periods[PER]) PER = 'this';
    render();
  }catch(e){
    const b = (navigator.language||'').slice(0,2).toLowerCase(); LANG = (b==='cs'||b==='sk')?'cs':'en';
    ['b-csv','b-print','b-back'].forEach(id => document.getElementById(id).style.display='none');
    document.getElementById('app').innerHTML = `<div id="err">${L('err')}</div>`;
  }
}
load();
</script>
</body>
</html>
